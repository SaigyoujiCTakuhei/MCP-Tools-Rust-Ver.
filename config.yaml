# config.yaml — KazeMiMiRin MCP Server 配置（Rust 纯二进制版）
server:
  host: "127.0.0.1"
  port: 58081
  auto_open_browser: true      # 启动时自动打开系统默认浏览器（关闭时 WebUI 会显示断开横幅）
  auth_token: ""               # 可选鉴权：非空则 MCP 端点要求 Authorization: Bearer <token>；环境变量 MCP_AUTH_TOKEN 优先
  allowed_origins: []          # 额外放行的 Origin（回环地址始终放行），如 llama.cpp UI：["http://127.0.0.1:8080"]

logging:
  level: "info"               # trace / debug / info / warn / error
  format: "json"              # json / pretty

tools:
  discovery_path: ""          # 插件扫描目录（kzm-* 可执行文件）；空 = exe 同目录（cargo run 时即 target/debug）
  default_timeout: 300        # 单次工具调用超时（秒，超时会连子进程一起终止；批量导入需较长超时）

mcp:
  prompts_path: "mcp_data/prompts"     # 提示词目录（*.json 或带 YAML front matter 的 *.md，热重载）
  resources_path: "mcp_data/resources" # 资源目录（*.json，file 型资源读取时取最新内容）
