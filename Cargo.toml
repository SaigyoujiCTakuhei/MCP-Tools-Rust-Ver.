[workspace]
resolver = "2"
members = ["server", "tool_kit", "tools", "plugins/pdf_reader", "plugins/sequential_thinking", "plugins/memory"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros"] }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
# SQLite（只读查询 ZCode 引擎库 db.sqlite；bundled=静态编译进二进制）
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
strip = true
