[package]
name = "kzm-pdf-reader"
version = "0.1.0"
edition = "2024"

# v11 Lib/pdf_reader 模块的 Rust 移植（按功能分目录的第一个域插件）
# 工具：kzm-pdf-read-local（本地 PDF 文本提取）、kzm-pdf-read-url（URL PDF 文本提取）

[dependencies]
tool_kit = { path = "../../tool_kit" }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["net"] }
# PDF 文本提取（纯 Rust，替代 v11 的 PyPDF2）
pdf-extract = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[[bin]]
name = "kzm-pdf-read-local"
path = "src/bin/pdf_read_local.rs"

[[bin]]
name = "kzm-pdf-read-url"
path = "src/bin/pdf_read_url.rs"
